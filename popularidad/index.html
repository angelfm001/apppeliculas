<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popularidad - Gestion de peliculas</title>
  <link rel="icon" type="image/png" href="../imagenes/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="page1">
<nav class="navbar navbar-expand navbar-dark bg-dark" id="navbar">
  <div class="container-fluid">
    <img src="../imagenes/logo.png" width="7%" style="margin-right:10px;" alt="logo">
    <a class="navbar-brand" href="../index.html">Web de peliculas</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="../catalogo/index.html">Catalogo</a></li>
        <li class="nav-item"><a class="nav-link" href="../genero/index.html">Genero</a></li>
        <li class="nav-item"><a class="nav-link active" href="./index.html">Popularidad</a></li>
      </ul>
    </div>
  </div>
  <div class="container-fluid" id="tema">
    <div class="form-check form-switch ms-auto">
      <label class="lblt" id="lbl1">Desactivar</label>
      <input class="form-check-input" type="checkbox" id="themeToggle" checked>
      <label class="lblt" for="themeToggle">tema oscuro</label>
    </div>
  </div>
</nav>

<div class="container mt-4"><div class="card" id="c1"><div class="card-body" style="overflow-x:auto;">
  <h1 class="text-center mb-4">Categorías de Popularidad</h1>
  <div id="msg" class="alert" style="display:none;"></div>
  <button class="btn btn-success mb-3" id="btnNuevo" style="color:#fff;">Nuevo</button>

  <div class="card mb-3" id="formCard" style="display:none;"><div class="card-body">
    <h5 class="card-title" id="formTitle">Nueva popularidad</h5>
    <form id="form">
      <input type="hidden" id="fid">
      <div class="mb-3"><label class="form-label">Nombre</label><input type="text" class="form-control" id="fnombre" required></div>
      <button type="submit" class="btn btn-secondary" id="btnGuardar">Crear</button>
      <button type="button" class="btn btn-secondary" id="btnVolver">Volver</button>
    </form>
  </div></div>

  <table class="table table-hover">
    <thead><tr><th>Id</th><th>Nombre</th><th>Acciones</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="3">Cargando...</td></tr></tbody>
  </table>
</div></div></div>
<div style="height:350px;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supa.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
const db = supaClient();
const tbody = document.getElementById('tbody');
async function load() {
  try {
    const rows = await db.list('popularidad');
    tbody.innerHTML = rows.length ? rows.map(r =>
      `<tr><td>${r.id}</td><td>${esc(r.nombre)}</td>
      <td><button class="btn btn-primary btn-sm" onclick="edit(${r.id},'${esc(r.nombre)}')">Editar</button>
      <button class="btn btn-danger btn-sm" onclick="del(${r.id})">Eliminar</button></td></tr>`).join('')
      : '<tr><td colspan="3">0 resultados</td></tr>';
  } catch (e) { tbody.innerHTML = `<tr><td colspan="3">${esc(e.message)}</td></tr>`; }
}
function edit(id, nombre) {
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('formTitle').textContent = 'Editar popularidad';
  document.getElementById('fid').value = id;
  document.getElementById('fnombre').value = nombre;
  document.getElementById('btnGuardar').textContent = 'Actualizar';
}
async function del(id) {
  if (!confirm('¿Seguro que desea eliminar?')) return;
  try {
    const n = await db.countBy('catalogo', 'id_popularidad', id);
    if (n > 0) { showMsg('msg', `Error: este valor está asignado a ${n} peliculas`, true); return; }
    await db.remove('popularidad', id);
    showMsg('msg', 'Eliminado correctamente'); load();
  } catch (e) { showMsg('msg', e.message, true); }
}
document.getElementById('btnNuevo').onclick = () => {
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('formTitle').textContent = 'Nueva popularidad';
  document.getElementById('fid').value = ''; document.getElementById('fnombre').value = '';
  document.getElementById('btnGuardar').textContent = 'Crear';
};
document.getElementById('btnVolver').onclick = () => document.getElementById('formCard').style.display = 'none';
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const id = document.getElementById('fid').value;
  const nombre = document.getElementById('fnombre').value.trim();
  if (!nombre) return;
  try {
    if (id) await db.update('popularidad', id, { nombre });
    else await db.insert('popularidad', { nombre });
    showMsg('msg', 'Guardado exitosamente');
    document.getElementById('formCard').style.display = 'none'; load();
  } catch (err) { showMsg('msg', err.message, true); }
};
load();
</script>
</body>
</html>
